name: Java CI with Maven

on:
  push:
    branches: [ "master", "feature/add_ci_cd" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17' # Укажите вашу версию Java
          distribution: 'temurin'
          cache: maven # Кэширует зависимости Maven, ускоряя сборку

      - name: Build and test with Maven
        run: ./mvnw -B verify
