spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  liquibase:
    enabled: false # Отключаем Liquibase для тестов, чтобы он не пытался накатить миграции на H2
  jpa:
    hibernate:
      ddl-auto: create-drop # Hibernate сам создаст таблицы для теста
    database-platform: org.hibernate.dialect.H2Dialect

app:
  jwt:
    secret: "test-secret-key-for-ci-that-is-long-enough-12345"
    access-token-ttl: 10h
    refresh-token-ttl: 7d
    issuer: tickets-module