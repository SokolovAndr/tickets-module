spring:
  application:
    name: tickets-module-app

  datasource:
    url: jdbc:postgresql://localhost:5454/tickets_module_db
    username: postgres
    password: postgres

  liquibase:
    enabled: true
    change-log: classpath:db.changelog-master.xml

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2s

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,caches,prometheus
  endpoint:
    prometheus:
      enabled: true
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true

server:
  port: 8080
  servlet:
    session:
      cookie:
        http-only: true
        secure: false

app:
  jwt:
    secret: ${JWT_SECRET}
    access-token-ttl: 10h
    refresh-token-ttl: 7d
    issuer: tickets-module

logging:
  level:
    org.springframework.security: DEBUG
    org.springframework.security.web.FilterChainProxy: INFO
    org.springframework.security.web.authentication.AnonymousAuthenticationFilter: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"