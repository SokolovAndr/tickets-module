spring:
  application:
    name: tickets-module-app

  datasource:
    url: jdbc:postgresql://localhost:5454/tickets-module_db
    username: postgres
    password: postgres

  liquibase:
    enabled: true
    change-log: classpath:db.changelog-master.xml

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2s

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,caches

server:
  port: 8099
  servlet:
    session:
      cookie:
        http-only: true
        secure: false

app:
  jwt:
    secret: ${JWT_SECRET}
    access-token-ttl: 10h
    refresh-token-ttl: 7d
    issuer: tickets-module

logging:
  level:
    org.springframework.security: DEBUG