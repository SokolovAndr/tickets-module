spring:
  application:
    name: tickets-module-app

  datasource:
    url: ${DATABASE_URL}

  liquibase:
    enabled: true
    change-log: classpath:db.changelog-master.xml

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        http-only: true
        secure: true
        same-site: lax
        name: TICKETS_SESSION

app:
  jwt:
    secret: ${JWT_SECRET}
    access-token-ttl: 10h
    refresh-token-ttl: 7d
    issuer: tickets-module