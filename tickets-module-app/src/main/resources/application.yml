spring:
  application:
    name: tickets-module-impl

  datasource:
    driver-class-name: org.postgresql.Driver

  jpa:
    show-sql: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    com.example.ticketsmoduleimpl: DEBUG
    # Log SQL statements
    org.hibernate.SQL: DEBUG
    # Log the parameter binding (for Hibernate 5 and earlier)
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    # Log the parameter binding (for Hibernate 6+ in Spring Boot 3+)
    org.hibernate.orm.jdbc.bind: TRACE

app:
  jwt:
    access-token-ttl: 10h
    refresh-token-ttl: 7d
    issuer: tickets-module