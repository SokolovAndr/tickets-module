name: Tickets Module CI

on:
  push:
#    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch: # Позволяет запускать вручную из вкладки Actions

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17' # Укажите вашу версию Java
          distribution: 'temurin'
          cache: maven # Кэширует зависимости Maven, ускоряя сборку

      - name: Build and test
        run: ./mvnw -B verify

      - name: Set up JDK 21 (only for Sonar)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          set-default: false

      - name: SonarCloud Scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          JAVA_HOME: ${{ env.JAVA_HOME_21_X64 }}
        run: >
          mvn -B sonar:sonar
          -Dsonar.projectKey=SokolovAndr_tickets-module
          -Dsonar.organization=sokolovandr
          -Dsonar.host.url=https://sonarcloud.io
          -Dsonar.coverage.jacoco.aggregateXmlReportPaths=coverage-report/target/site/jacoco/jacoco.xml
          -Dsonar.coverage.exclusions=**/Application.java,**/config/**,**/common/aop/**,**/common/web/rest/exceptions/**,**/common/domain/enumeration/**,**/domain/*Entity.java,**/domain/*Builder.java,**/repository/**,**/common/domain/exception/**,**/oauth/service/CurrentUserService.java

      - name: Upload JaCoCo Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-report
          path: |
            coverage-report/target/site/jacoco/jacoco.xml
            tickets-module-impl/target/*.exec
            tickets-module-app/target/*.exec