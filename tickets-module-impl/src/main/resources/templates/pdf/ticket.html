<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Билет</title>
    <style>
        @page {
            size: auto;
            margin: 10mm;
        }

        body {
            font-family: 'NotoSans', sans-serif;
            color: #1e293b;
            margin: 0;
            padding: 0;
        }

        .ticket-container {
            border: 2px dashed #6366f1;
            border-radius: 12px;
            padding: 30px;
            background-color: #f8fafc;
            box-sizing: border-box;
        }

        .header {
            text-align: center;
            margin-bottom: 15px;
            border-bottom: 2px solid #cbd5e1;
            padding-bottom: 10px;
        }

        .header h1 {
            font-size: 26px;
            color: #4f46e5;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .details-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 15px;
        }

        .details-table td {
            padding: 8px 10px;
            border-bottom: 1px solid #e2e8f0;
            font-size: 16px;
        }

        .details-table td:first-child {
            color: #64748b;
            width: 40%;
        }

        .seat-badge {
            display: inline-block;
            background-color: #e0e7ff;
            color: #3730a3;
            padding: 15px 25px;
            border-radius: 10px;
            font-size: 22px;
            font-weight: bold;
            border: 1px solid #a5b4fc;
        }

        .price-info {
            font-size: 28px;
            font-weight: bold;
            color: #059669;
        }
    </style>
</head>
<body>
<div class="ticket-container">
    <div class="header">
        <h1>Электронный билет</h1>
    </div>

    <table style="width: 100%; text-align: center; margin-bottom: 15px;">
        <tr>
            <td style="text-align: left; width: 45%; font-size: 24px; font-weight: bold; color: #0f172a;"
                th:text="${ticket.route.departurePoint}">Москва</td>

            <td style="text-align: left; width: 10%; vertical-align: middle;">
                <div style="display: inline-block; width: 0; height: 0;
                            border-top: 8px solid transparent;
                            border-bottom: 8px solid transparent;
                            border-left: 12px solid #6366f1;
                            margin-top: 4px;"></div>
            </td>

            <td style="text-align: left; width: 45%; font-size: 24px; font-weight: bold; color: #0f172a;"
                th:text="${ticket.route.destinationPoint}">Санкт-Петербург</td>
        </tr>
    </table>

    <table class="details-table">
        <tr>
            <td>Отправление</td>
            <td><strong th:text="${#temporals.format(ticket.route.departureAt, 'dd.MM.yyyy HH:mm')}"></strong></td>
        </tr>
        <tr>
            <td>Прибытие</td>
            <td><strong th:text="${#temporals.format(ticket.route.destinationAt, 'dd.MM.yyyy HH:mm')}"></strong></td>
        </tr>
        <tr>
            <td>Пассажир</td>
            <td><strong th:text="${ticket.user.fullName}"></strong></td>
        </tr>
        <tr>
            <td>Дата покупки</td>
            <td><strong th:text="${#temporals.format(ticket.purchasedAt, 'dd.MM.yyyy HH:mm')}"></strong></td>
        </tr>
        <tr>
            <td>Перевозчик</td>
            <td><strong th:text="${ticket.route.carrier.name}"></strong></td>
        </tr>
    </table>

    <table style="width: 100%;">
        <tr>
            <td style="text-align: left; vertical-align: bottom;">
                <div class="seat-badge">Место: <span th:text="${ticket.seatNumber}">1</span></div>
            </td>
            <td style="text-align: right; vertical-align: bottom;">
                <div class="price-info" th:text="${ticket.price} + ' ₽'">1250.50 ₽</div>
            </td>
        </tr>
    </table>
</div>
</body>
</html>
