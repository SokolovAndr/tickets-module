spring:
  application:
    name: tickets-module-impl

  datasource:
    url: jdbc:postgresql://localhost:5454/tickets-module_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    show-sql: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true

  liquibase:
    enabled: true
    change-log: classpath:db.changelog-master.xml

server:
  port: 8099
  servlet:
    session:
      cookie:
        http-only: true

logging:
  level:
    com.example.ticketsmoduleimpl: DEBUG
    # Log SQL statements
    org.hibernate.SQL: DEBUG
    # Log the parameter binding (for Hibernate 5 and earlier)
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    # Log the parameter binding (for Hibernate 6+ in Spring Boot 3+)
    org.hibernate.orm.jdbc.bind: TRACE