spring:
  application:
    name: tickets-module-impl

  datasource:
    url: jdbc:postgresql://localhost:5454/tickets-module_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true

  liquibase:
    enabled: true
    change-log: classpath:db.changelog-master.xml

server:
  port: 8099
  servlet:
    session:
      cookie:
        http-only: true