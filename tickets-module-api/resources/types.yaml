openapi: 3.0.1
info:
  title: Types
  version: 1.0.0
servers: [ ]
paths: { }
components:
  schemas:

    LoginRequest:
      type: object
      required:
        - login
        - password
      properties:
        login:
          title: Логин
          description: Логин
          type: string
        password:
          title: Пароль
          description: Пароль
          type: string

    RegisterRequest:
      type: object
      required:
        - login
        - password
        - fullName
      properties:
        login:
          title: Логин
          description: Логин
          type: string
          minLength: 5
          maxLength: 20
        password:
          title: Пароль
          description: Пароль
          type: string
          minLength: 5
          maxLength: 20
        fullName:
          title: Полное имя
          description: Полное имя
          type: string
          maxLength: 255

    LoginResponse:
      type: object
      required:
        - access_token
        - expires_in
        - refresh_token
        - token_type
      properties:
        access_token:
          title: Токен доступа
          description: Токен доступа
          type: string
        expires_in:
          title: Токен истекает через
          description: Token истекает через
          type: integer
        refresh_token:
          title: RefreshToken
          description: RefreshToken
          type: string
        token_type:
          title: Тип токена
          description: Тип токена
          type: string

    RefreshTokenRequest:
      type: object
      required:
        - refresh_token
      properties:
        refresh_token:
          type: string

    CommonResponse:
      type: object
      x-generic-parent: true
      additionalProperties: true
      description: Общий предок всех ответов
      properties:
        requestId:
          type: string
          format: uuid
          description: Идентификатор входящего запроса(UUID)

    ErrorResponse:
      type: object
      x-generic-parent: true
      additionalProperties: true
      description: Ответ сервера содержащий ошибку
      allOf:
        - $ref: "#/components/schemas/CommonResponse"
        - properties:
            message:
              type: string
              description: Системное сообщение.
            userMessage:
              type: string
              description: Сообщение для отображения пользователю.

    CommonDto:
      x-generic-parent: true
      description: Базовый объект DTO
      discriminator:
        propertyName: kind
      type: object
      required:
        - id
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
          description: Идентификатор
        createdAt:
          title: Дата создания
          description: Дата создания
          type: string
          format: date-time
        updatedAt:
          title: Дата обновления
          description: Дата обновления
          type: string
          format: date-time

    CreateCarrierRequest:
      type: object
      required:
        - name
        - phone
      properties:
        name:
          title: Название компании
          description: Название компании
          type: string
          minLength: 1
          maxLength: 255
        phone:
          title: Телефон
          description: Телефон
          type: string
          minLength: 1
          maxLength: 20

    CreateCarrierResponse:
      type: object
      required:
        - name
        - phone
      allOf:
        - $ref: "#/components/schemas/CommonDto"
      properties:
        name:
          title: Название компании
          description: Название компании
          type: string
        phone:
          title: Телефон
          description: Телефон
          type: string

    CreateRouteRequest:
      type: object
      required:
        - departurePoint
        - destinationPoint
        - departureAt
        - destinationAt
        - carrierId
        - durationMinutes
      properties:
        departurePoint:
          title: Пункт отправления
          description: Пункт отправления
          type: string
          minLength: 1
          maxLength: 255
        destinationPoint:
          title: Пункт назначения
          description: Пункт назначения
          type: string
          minLength: 1
          maxLength: 255
        departureAt:
          title: Дата отправления
          description: Дата отправления
          type: string
          format: date-time
        destinationAt:
          title: Дата прибытия
          description: Дата прибытия
          type: string
          format: date-time
        carrierId:
          title: Идентификатор компании перевозчика
          description: Идентификатор компании перевозчика
          type: string
          format: uuid
        durationMinutes:
          title: Длительность в минутах
          description: Длительность в минутах
          type: integer
          format: int32
          example: 100

    CreateRouteResponse:
      type: object
      required:
        - departurePoint
        - destinationPoint
        - departureAt
        - destinationAt
        - carrierId
        - durationMinutes
      allOf:
        - $ref: "#/components/schemas/CommonDto"
      properties:
        departurePoint:
          title: Пункт отправления
          description: Пункт отправления
          type: string
        destinationPoint:
          title: Пункт назначения
          description: Пункт назначения
          type: string
        departureAt:
          title: Дата отправления
          description: Дата отправления
          type: string
          format: date-time
        destinationAt:
          title: Дата прибытия
          description: Дата прибытия
          type: string
          format: date-time
        carrierId:
          title: Идентификатор компании перевозчика
          description: Идентификатор компании перевозчика
          type: string
          format: uuid
        carrierName:
          title: Название компании перевозчика
          description: Название компании перевозчика
          type: string
        durationMinutes:
          title: Длительность в минутах
          description: Длительность в минутах
          type: integer
          format: int32

    Pageable:
      description: Типовой объект постраничного запроса
      type: object
      properties:
        page:
          type: integer
          format: int32
          default: 0
          description: Номер страницы для постраничного вывода
        size:
          type: integer
          format: int32
          default: 20
          description: Размер страницы для постраничного вывода
        sort:
          type: array
          items:
            type: string
          description: Признак сортировки в формате "property,asc" или "property,desc". Может быть передано несколько признаков.

    CreateTicketRequest:
      type: object
      required:
        - routeId
        - seatNumber
        - price
      properties:
        routeId:
          title: Идентификатор маршрута
          description: Идентификатор маршрута, к которому относится билет
          type: string
          format: uuid
        seatNumber:
          title: Номер места
          description: Номер места в транспортном средстве
          type: integer
          format: int32
          minimum: 1
        price:
          title: Цена
          description: Цена билета
          type: number
          format: double
          minimum: 0
          example: 1250.50

    CreateTicketResponse:
      type: object
      required:
        - routeId
        - seatNumber
        - price
        - ticketStatus
      allOf:
        - $ref: "#/components/schemas/CommonDto"
      properties:
        routeId:
          title: Идентификатор маршрута
          description: Идентификатор маршрута, к которому относится билет
          type: string
          format: uuid
        seatNumber:
          title: Номер места
          description: Номер места в транспортном средстве
          type: integer
          format: int32
        price:
          title: Цена
          description: Цена билета
          type: number
          format: double
        ticketStatus:
          $ref: "#/components/schemas/TicketStatusEnum"
        purchasedById:
          title: Идентификатор пользователя
          description: Идентификатор пользователя, купившего билет (если куплен)
          type: string
          format: uuid
          nullable: true
        purchasedAt:
          title: Дата покупки
          description: Дата и время покупки билета
          type: string
          format: date-time
          nullable: true

    CreateOrderRequest:
      type: object
      required:
        - ticketId
      properties:
        ticketId:
          title: Идентификатор билета
          description: Билет, который резервируется в этом заказе
          type: string
          format: uuid

    CreateOrderResponse:
      type: object
      required:
        - ticket
        - user
        - status
        - reservedUntil
      allOf:
        - $ref: "#/components/schemas/CommonDto"
      properties:
        ticket:
          $ref: "#/components/schemas/CreateTicketResponse"
        user:
          $ref: "#/components/schemas/UserResponse"
        status:
          $ref: "#/components/schemas/OrderStatusEnum"
        reservedUntil:
          title: Крайние дата и время оплаты заказа
          description: Крайние дата и время оплаты заказа
          type: string
          format: date-time
        paidAt:
          title: Дата и время оплаты заказа
          description: Дата и время оплаты заказа
          type: string
          format: date-time
          nullable: true
        canceledAt:
          title: Дата и время отмены заказа
          description: Дата и время отмены заказа
          type: string
          format: date-time
          nullable: true
        refundedAt:
          title: Дата и время возврата заказа
          description: Дата и время возврата заказа
          type: string
          format: date-time
          nullable: true

    OrdersSearchRequest:
      type: object
      properties:
        ticketId:
          title: Идентификатор билета
          description: Идентификатор билета
          type: string
          format: uuid
        userId:
          title: Идентификатор покупателя
          description: Идентификатор покупателя
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/OrderStatusEnum"
        createdDateFrom:
          title: Дата создания с
          description: Дата создания с
          type: string
          format: date
        createdDateTo:
          title: Дата создания по
          description: Дата создания по
          type: string
          format: date
        reservedUntilFrom:
          title: Зарезервирован с
          description: Зарезервирован с
          type: string
          format: date
        reservedUntilTo:
          title: Зарезервирован по
          description: Зарезервирован по
          type: string
          format: date
        paidDateFrom:
          title: Оплачен с
          description: Оплачен с
          type: string
          format: date
        paidDateTo:
          title: Оплачен по
          description: Оплачен по
          type: string
          format: date
        canceledDateFrom:
          title: Отменен с
          description: Отменен с
          type: string
          format: date
        canceledDateTo:
          title: Отменен по
          description: Отменен по
          type: string
          format: date
        refundedDateFrom:
          title: Возвращен с
          description: Возвращен с
          type: string
          format: date
        refundedDateTo:
          title: Возвращен по
          description: Возвращен по
          type: string
          format: date

    TicketsSearchRequest:
      type: object
      properties:
        query:
          title: Быстрый поиск
          description: Поиск по ilike по полям seatNumber (как строка), price (как строка)
          type: string
        routeId:
          title: Идентификатор маршрута
          description: Идентификатор маршрута
          type: string
          format: uuid
        seatNumber:
          title: Номер места
          description: Номер места
          type: integer
          format: int32
        priceFrom:
          title: Цена от
          description: Цена от
          type: number
          format: double
          minimum: 0
        priceTo:
          title: Цена до
          description: Цена до
          type: number
          format: double
          minimum: 0
        ticketStatus:
          $ref: "#/components/schemas/TicketStatusEnum"
        purchasedById:
          title: Идентификатор пользователя
          description: Идентификатор пользователя, купившего билет
          type: string
          format: uuid
        purchasedDateFrom:
          title: Дата покупки с
          description: Дата покупки с
          type: string
          format: date
        purchasedDateTo:
          title: Дата покупки по
          description: Дата покупки по
          type: string
          format: date
        createdDateFrom:
          title: Дата создания с
          description: Дата создания с
          type: string
          format: date
        createdDateTo:
          title: Дата создания по
          description: Дата создания по
          type: string
          format: date

    CarriersSearchRequest:
      type: object
      properties:
        query:
          title: Быстрый поиск
          description: Поиск по ilike по полям name, phone
          type: string
        name:
          description: Название
          type: string
        phone:
          description: Телефон
          type: string
        createDateFrom:
          description: Дата создания с
          type: string
          format: date
        createDateTo:
          description: Дата создания по
          type: string
          format: date

    RoutesSearchRequest:
      type: object
      properties:
        query:
          title: Быстрый поиск
          description: Поиск по ilike по полям departurePoint, destinationPoint
          type: string
        departurePoint:
          title: Пункт отправления
          description: Пункт отправления
          type: string
        destinationPoint:
          title: Пункт назначения
          description: Пункт назначения
          type: string
        departureFrom:
          title: Время отправления с
          description: Время отправления с
          type: string
          format: date
        departureTo:
          title: Время отправления по
          description: Время отправления по
          type: string
          format: date
        destinationFrom:
          title: Время прибытия c
          description: Время прибытия c
          type: string
          format: date
        destinationTo:
          title: Время прибытия по
          description: Время прибытия по
          type: string
          format: date
        createDateFrom:
          description: Дата создания с
          type: string
          format: date
        createDateTo:
          description: Дата создания по
          type: string
          format: date
        emptySits:
          title: Признак наличия свободных мест
          description: Признак наличия свободных мест
          type: boolean

    Page:
      description: Объект постраничного ответа org.springframework.data.persistence.Page
      type: object
      properties:
        content:
          type: array
          items: { }
          description: Массив элементов текущей страницы
        last:
          type: boolean
          description: Признак последней страницы
        totalElements:
          type: integer
          format: int64
          description: Общее количество элементов
        totalPages:
          type: integer
          format: int32
          description: Общее количество страниц
        first:
          type: boolean
          description: Признак первой страницы
        numberOfElements:
          type: integer
          format: int32
          description: Количество элементов на текущей странице
        size:
          type: integer
          format: int32
          description: Размер страницы
        number:
          type: integer
          format: int32
          description: Номер текущей страницы
        empty:
          type: boolean
          description: Признак пустой страницы

    ReleaseTicketsBatchRequest:
      type: object
      required:
        - routeId
        - seatCount
        - price
      properties:
        routeId:
          title: Идентификатор маршрута
          description: Идентификатор маршрута, к которому относится билет
          type: string
          format: uuid
        seatCount:
          title: Кол-во мест
          description: Кол-во мест
          type: integer
          format: int32
          minimum: 1
        price:
          title: Цена
          description: Цена билета
          type: number
          format: double
          minimum: 0
          example: 1250.50

    ReleaseTicketsBatchResponse:
      type: object
      required:
        - routeId
        - createdCount
        - price
        - ticketsIds
      properties:
        routeId:
          title: Идентификатор маршрута, для которого выпущены билеты
          description: Идентификатор маршрута, для которого выпущены билеты
          type: string
          format: uuid
        createdCount:
          title: Кол-во созданных мест
          description: Кол-во созданных мест
          type: integer
          format: int32
        price:
          title: Цена
          description: Цена билета
          type: number
          format: double
          minimum: 0
          example: 1250.50
        ticketsIds:
          title: Идентификаторы выпущенных билетов
          description: Идентификаторы выпущенных билетов (только новые, созданные в этом запросе)
          type: array
          items:
            type: string
            format: uuid

    UserResponse:
      type: object
      required:
        - login
        - fullName
        - role
      allOf:
        - $ref: "#/components/schemas/CommonDto"
      properties:
        login:
          title: Логин
          description: Логин
          type: string
        fullName:
          title: ФИО
          description: ФИО
          type: string
        role:
          title: Роль
          description: Роль пользователя в системе
          type: string
          enum: [ USER, ADMIN ]

    ChangePasswordRequest:
      type: object
      required:
        - oldPassword
        - newPassword
      properties:
        oldPassword:
          title: Старый пароль
          description: Старый пароль
          type: string
          format: password
          example: oldPass123
        newPassword:
          title: Новый пароль
          description: Новый пароль
          type: string
          format: password
          minLength: 5
          example: newPass123

    OrderStatusEnum:
      type: string
      enum:
        - WAITING
        - TIME_OUT
        - PAID
        - CANCELED
        - REFUNDED
      description: Статус заказа
      x-enum-descriptions:
        - Ожидание оплаты
        - Время на оплату истекло
        - Оплачен
        - Отменен до оплаты
        - Возвращен после оплаты

    TicketStatusEnum:
      type: string
      enum:
        - AVAILABLE
        - RESERVED
        - PURCHASED
      description: Статус билета
      x-enum-descriptions:
        - Доступен для покупки
        - Зарезервирован
        - Куплен
