openapi: 3.0.1
info:
  title: Types
  version: 1.0.0
servers: [ ]
paths: { }
components:
  schemas:

    LoginRequest:
      type: object
      required:
        - login
        - password
      properties:
        login:
          title: Логин
          description: Логин
          type: string
        password:
          title: Пароль
          description: Пароль
          type: string

    RegisterRequest:
      type: object
      required:
        - login
        - password
        - fullName
      properties:
        login:
          title: Логин
          description: Логин
          type: string
          minLength: 5
          maxLength: 20
        password:
          title: Пароль
          description: Пароль
          type: string
          minLength: 5
          maxLength: 20
        fullName:
          title: Полное имя
          description: Полное имя
          type: string
          maxLength: 255

    LoginResponse:
      type: object
      required:
        - access_token
        - expires_in
        - refresh_token
        - token_type
      properties:
        access_token:
          title: Токен доступа
          description: Токен доступа
          type: string
        expires_in:
          title: Токен истекает через
          description: Token истекает через
          type: integer
        refresh_token:
          title: RefreshToken
          description: RefreshToken
          type: string
        token_type:
          title: Тип токена
          description: Тип токена
          type: string

    RefreshTokenRequest:
      type: object
      required:
        - refresh_token
      properties:
        refresh_token:
          type: string

    CommonResponse:
      type: object
      x-generic-parent: true
      additionalProperties: true
      description: Общий предок всех ответов
      properties:
        requestId:
          type: string
          format: uuid
          description: Идентификатор входящего запроса(UUID)

    ErrorResponse:
      type: object
      x-generic-parent: true
      additionalProperties: true
      description: Ответ сервера содержащий ошибку
      allOf:
        - $ref: "#/components/schemas/CommonResponse"
        - properties:
            message:
              type: string
              description: Системное сообщение.
            userMessage:
              type: string
              description: Сообщение для отображения пользователю.

    CreateCarrierRequest:
      type: object
      required:
        - name
        - phone
      properties:
        name:
          title: Название компании
          description: Название компании
          type: string
        phone:
          title: Телефон
          description: Телефон
          type: string

    CreateCarrierResponse:
      type: object
      required:
        - id
        - name
        - phone
      properties:
        id:
          title: Идентификатор компании перевозчика
          description: Идентификатор компании перевозчика
          type: string
          format: uuid
        name:
          title: Название компании
          description: Название компании
          type: string
        phone:
          title: Телефон
          description: Телефон
          type: string
        createdAt:
          title: Дата создания
          description: Дата создания
          type: string
          format: date-time
        updatedAt:
          title: Дата обновления
          description: Дата обновления
          type: string
          format: date-time

    CreateRouteRequest:
      type: object
      required:
        - departurePoint
        - destinationPoint
        - departureAt
        - destinationAt
        - carrierId
        - durationMinutes
      properties:
        departurePoint:
          title: Пункт отправления
          description: Пункт отправления
          type: string
        destinationPoint:
          title: Пункт назначения
          description: Пункт назначения
          type: string
        departureAt:
          title: Дата отправления
          description: Дата отправления
          type: string
          format: date-time
        destinationAt:
          title: Дата прибытия
          description: Дата прибытия
          type: string
          format: date-time
        carrierId:
          title: Идентификатор компании перевозчика
          description: Идентификатор компании перевозчика
          type: string
          format: uuid
        durationMinutes:
          title: Длительность в минутах
          description: Длительность в минутах
          type: integer
          format: int32
          example: 100

    CreateRouteResponse:
      type: object
      required:
        - id
        - departurePoint
        - destinationPoint
        - departureAt
        - destinationAt
        - carrierId
        - durationMinutes
      properties:
        id:
          title: Идентификатор маршрута
          description: Идентификатор маршрута
          type: string
          format: uuid
        departurePoint:
          title: Пункт отправления
          description: Пункт отправления
          type: string
        destinationPoint:
          title: Пункт назначения
          description: Пункт назначения
          type: string
        departureAt:
          title: Дата отправления
          description: Дата отправления
          type: string
          format: date-time
        destinationAt:
          title: Дата прибытия
          description: Дата прибытия
          type: string
          format: date-time
        carrierId:
          title: Идентификатор компании перевозчика
          description: Идентификатор компании перевозчика
          type: string
          format: uuid
        durationMinutes:
          title: Длительность в минутах
          description: Длительность в минутах
          type: integer
          format: int32
        createdAt:
          title: Дата создания
          description: Дата создания
          type: string
          format: date-time
        updatedAt:
          title: Дата обновления
          description: Дата обновления
          type: string
          format: date-time

    Pageable:
      description: Типовой объект постраничного запроса
      type: object
      properties:
        page:
          type: integer
          format: int32
          default: 0
          description: Номер страницы для постраничного вывода
        size:
          type: integer
          format: int32
          default: 20
          description: Размер страницы для постраничного вывода
        sort:
          type: array
          items:
            type: string
          description: Признак сортировки в формате "property,asc" или "property,desc". Может быть передано несколько признаков.

    CreateTicketRequest:
      type: object
      required:
        - routeId
        - seatNumber
        - price
      properties:
        routeId:
          title: Идентификатор маршрута
          description: Идентификатор маршрута, к которому относится билет
          type: string
          format: uuid
        seatNumber:
          title: Номер места
          description: Номер места в транспортном средстве
          type: integer
          format: int32
          minimum: 1
        price:
          title: Цена
          description: Цена билета
          type: number
          format: double
          minimum: 0
          example: 1250.50

    CreateTicketResponse:
      type: object
      required:
        - id
        - routeId
        - seatNumber
        - price
        - isPurchased
      properties:
        id:
          title: Идентификатор билета
          description: Уникальный идентификатор билета
          type: string
          format: uuid
        routeId:
          title: Идентификатор маршрута
          description: Идентификатор маршрута, к которому относится билет
          type: string
          format: uuid
        seatNumber:
          title: Номер места
          description: Номер места в транспортном средстве
          type: integer
          format: int32
        price:
          title: Цена
          description: Цена билета
          type: number
          format: double
        isPurchased:
          title: Признак занятости
          description: Признак, куплен ли билет (оплачен)
          type: boolean
        purchasedById:
          title: Идентификатор пользователя
          description: Идентификатор пользователя, купившего билет (если куплен)
          type: string
          format: uuid
          nullable: true
        purchasedAt:
          title: Дата покупки
          description: Дата и время покупки билета
          type: string
          format: date-time
          nullable: true
        createdAt:
          title: Дата создания
          description: Дата и время создания записи билета
          type: string
          format: date-time
        updatedAt:
          title: Дата обновления
          description: Дата и время последнего обновления записи билета
          type: string
          format: date-time

    TicketsSearchRequest:
      type: object
      properties:
        query:
          title: Быстрый поиск
          description: Поиск по ilike по полям seatNumber (как строка), price (как строка)
          type: string
        routeId:
          title: Идентификатор маршрута
          description: Идентификатор маршрута
          type: string
          format: uuid
        seatNumber:
          title: Номер места
          description: Номер места
          type: integer
          format: int32
        priceFrom:
          title: Цена от
          description: Цена от
          type: number
          format: double
          minimum: 0
        priceTo:
          title: Цена до
          description: Цена до
          type: number
          format: double
          minimum: 0
        isPurchased:
          title: Признак занятости
          description: Признак, куплен ли билет
          type: boolean
        purchasedById:
          title: Идентификатор пользователя
          description: Идентификатор пользователя, купившего билет
          type: string
          format: uuid
        purchasedDateFrom:
          title: Дата покупки с
          description: Дата покупки с
          type: string
          format: date
        purchasedDateTo:
          title: Дата покупки по
          description: Дата покупки по
          type: string
          format: date
        createdDateFrom:
          title: Дата создания с
          description: Дата создания с
          type: string
          format: date
        createdDateTo:
          title: Дата создания по
          description: Дата создания по
          type: string
          format: date

    CarriersSearchRequest:
      type: object
      properties:
        query:
          title: Быстрый поиск
          description: Поиск по ilike по полям name, phone
          type: string
        name:
          description: Название
          type: string
        phone:
          description: Телефон
          type: string
        createDateFrom:
          description: Дата создания с
          type: string
          format: date
        createDateTo:
          description: Дата создания по
          type: string
          format: date

    RoutesSearchRequest:
      type: object
      properties:
        query:
          title: Быстрый поиск
          description: Поиск по ilike по полям departurePoint, destinationPoint
          type: string
        departurePoint:
          title: Пункт отправления
          description: Пункт отправления
          type: string
        destinationPoint:
          title: Пункт назначения
          description: Пункт назначения
          type: string
        departureFrom:
          title: Время отправления с
          description: Время отправления с
          type: string
          format: date
        departureTo:
          title: Время отправления по
          description: Время отправления по
          type: string
          format: date
        destinationFrom:
          title: Время прибытия c
          description: Время прибытия c
          type: string
          format: date
        destinationTo:
          title: Время прибытия по
          description: Время прибытия по
          type: string
          format: date
        createDateFrom:
          description: Дата создания с
          type: string
          format: date
        createDateTo:
          description: Дата создания по
          type: string
          format: date
        emptySits:
          title: Признак наличия свободных мест
          description: Признак наличия свободных мест
          type: boolean

    Page:
      description: Объект постраничного ответа org.springframework.data.domain.Page
      type: object
      properties:
        content:
          type: array
          items: { }
          description: Массив элементов текущей страницы
        last:
          type: boolean
          description: Признак последней страницы
        totalElements:
          type: integer
          format: int64
          description: Общее количество элементов
        totalPages:
          type: integer
          format: int32
          description: Общее количество страниц
        first:
          type: boolean
          description: Признак первой страницы
        numberOfElements:
          type: integer
          format: int32
          description: Количество элементов на текущей странице
        size:
          type: integer
          format: int32
          description: Размер страницы
        number:
          type: integer
          format: int32
          description: Номер текущей страницы
        empty:
          type: boolean
          description: Признак пустой страницы

    ReleaseTicketsBatchRequest:
      type: object
      required:
        - routeId
        - seatCount
        - price
      properties:
        routeId:
          title: Идентификатор маршрута
          description: Идентификатор маршрута, к которому относится билет
          type: string
          format: uuid
        seatCount:
          title: Кол-во мест
          description: Кол-во мест
          type: integer
          format: int32
          minimum: 1
        price:
          title: Цена
          description: Цена билета
          type: number
          format: double
          minimum: 0
          example: 1250.50

    ReleaseTicketsBatchResponse:
      type: object
      required:
        - routeId
        - createdCount
        - price
        - ticketsIds
      properties:
        routeId:
          title: Идентификатор маршрута, для которого выпущены билеты
          description: Идентификатор маршрута, для которого выпущены билеты
          type: string
          format: uuid
        createdCount:
          title: Кол-во созданных мест
          description: Кол-во созданных мест
          type: integer
          format: int32
        price:
          title: Цена
          description: Цена билета
          type: number
          format: double
          minimum: 0
          example: 1250.50
        ticketsIds:
          title: Идентификаторы выпущенных билетов
          description: Идентификаторы выпущенных билетов (только новые, созданные в этом запросе)
          type: array
          items:
            type: string
            format: uuid