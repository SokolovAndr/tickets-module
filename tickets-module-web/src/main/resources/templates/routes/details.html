<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Маршрут — Система билетов</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg-start: #0f172a; --bg-end: #1e293b;
            --accent: #6366f1; --accent-hover: #818cf8;
            --danger: #ef4444; --success: #10b981;
            --text: #e2e8f0; --text-muted: #94a3b8;
            --card-bg: rgba(30, 41, 59, 0.7);
            --card-hover: rgba(51, 65, 85, 0.85);
            --border: rgba(148, 163, 184, 0.15);
        }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, var(--bg-start) 0%, var(--bg-end) 100%);
            color: var(--text); position: relative; overflow-x: hidden;
        }
        body::before, body::after {
            content: ''; position: fixed; border-radius: 50%;
            filter: blur(120px); opacity: 0.35;
            pointer-events: none; z-index: 0;
        }
        body::before { width: 500px; height: 500px; background: var(--accent); top: -200px; left: -200px; }
        body::after { width: 400px; height: 400px; background: #8b5cf6; bottom: -150px; right: -150px; }

        .header {
            position: relative; z-index: 2;
            display: flex; align-items: center; justify-content: space-between;
            padding: 20px 32px; border-bottom: 1px solid var(--border);
            background: rgba(15, 23, 42, 0.5);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
        }
        .brand { display: flex; align-items: center; gap: 12px; font-size: 18px; font-weight: 700; letter-spacing: -0.3px; text-decoration: none; color: inherit; }
        .brand-logo { display: flex; align-items: center; justify-content: center; width: 40px; height: 40px;
            background: linear-gradient(135deg, var(--accent), #8b5cf6); border-radius: 12px;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.4); }
        .brand-logo svg { width: 22px; height: 22px; stroke: #fff; }
        .header-actions { display: flex; align-items: center; gap: 8px; }
        .nav-link { padding: 8px 14px; border-radius: 10px; color: var(--text-muted); text-decoration: none;
            font-size: 14px; font-weight: 500; transition: all 0.2s; }
        .nav-link:hover { color: var(--text); background: rgba(99, 102, 241, 0.1); }
        .nav-link.active { color: var(--accent-hover); background: rgba(99, 102, 241, 0.15); }
        .logout-btn { display: inline-flex; align-items: center; gap: 8px; padding: 10px 16px;
            background: rgba(239, 68, 68, 0.1); color: #fca5a5;
            border: 1px solid rgba(239, 68, 68, 0.25); border-radius: 10px;
            font-size: 14px; font-weight: 500; font-family: inherit; cursor: pointer;
            transition: all 0.2s ease; }
        .logout-btn:hover { background: rgba(239, 68, 68, 0.2); border-color: rgba(239, 68, 68, 0.4); color: #fecaca; transform: translateY(-1px); }
        .logout-btn svg { width: 16px; height: 16px; stroke: currentColor; }

        .main { position: relative; z-index: 1; max-width: 1000px; margin: 0 auto; padding: 48px 32px 80px; }

        .back-link { display: inline-flex; align-items: center; gap: 8px;
            color: var(--text-muted); text-decoration: none; font-size: 14px;
            margin-bottom: 20px; transition: color 0.2s; }
        .back-link:hover { color: var(--accent-hover); }
        .back-link svg { width: 16px; height: 16px; stroke: currentColor; }

        .alert { padding: 12px 16px; border-radius: 10px; font-size: 14px; margin-bottom: 16px; animation: slideDown 0.3s ease-out; }
        @keyframes slideDown { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: translateY(0); } }
        .alert-success { background: rgba(16, 185, 129, 0.12); color: #6ee7b7; border: 1px solid rgba(16, 185, 129, 0.25); }
        .alert-danger { background: rgba(239, 68, 68, 0.12); color: #fca5a5; border: 1px solid rgba(239, 68, 68, 0.25); }

        .route-hero {
            padding: 32px 28px; margin-bottom: 32px;
            background: var(--card-bg);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border); border-radius: 20px;
            animation: fadeInUp 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .route-hero-path { display: flex; align-items: center; gap: 16px; font-size: 30px; font-weight: 700; letter-spacing: -0.8px; margin-bottom: 20px; }
        .route-hero-path .arrow { color: var(--accent-hover); display: flex; align-items: center; }
        .route-hero-path .arrow svg { width: 28px; height: 28px; stroke: currentColor; }
        .route-hero-meta { display: flex; flex-wrap: wrap; gap: 16px 40px; font-size: 15px; color: var(--text-muted); }
        .route-hero-meta-item { display: flex; align-items: center; gap: 10px; }
        .route-hero-meta-item svg { width: 18px; height: 18px; stroke: var(--text-muted); flex-shrink: 0; }
        .route-hero-meta-item .value { color: var(--text); font-weight: 500; }

        .section-title { font-size: 14px; font-weight: 600; color: var(--text-muted);
            text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 16px; }

        .seats {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 12px;
        }
        .seats form {
            display: contents;  /* форма «исчезает» из раскладки, button становится ячейкой грида */
        }
        .seat {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 18px 14px; gap: 6px;
            background: var(--card-bg);
            border: 1px solid var(--border); border-radius: 14px;
            font-family: inherit; cursor: pointer; color: inherit;
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
            animation: fadeInUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) backwards;
            width: 100%;
            appearance: none;
            -webkit-appearance: none;
            font: inherit;
            outline: none;
        }
        .seat:hover {
            transform: translateY(-2px);
            border-color: rgba(99, 102, 241, 0.5);
            background: var(--card-hover);
            box-shadow: 0 8px 20px rgba(99, 102, 241, 0.25);
        }
        .seat-num { font-size: 26px; font-weight: 700; color: var(--accent-hover); line-height: 1; }
        .seat-label { font-size: 11px; text-transform: uppercase; color: var(--text-muted); letter-spacing: 1px; }
        .seat-price { font-size: 14px; font-weight: 600; margin-top: 4px; }

        .empty { text-align: center; padding: 60px 20px;
            background: var(--card-bg); border: 1px solid var(--border); border-radius: 16px; }
        .empty-icon { display: flex; align-items: center; justify-content: center;
            width: 72px; height: 72px; margin: 0 auto 20px;
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.15), rgba(139, 92, 246, 0.15));
            border: 1px solid rgba(99, 102, 241, 0.3); border-radius: 18px; }
        .empty-icon svg { width: 36px; height: 36px; stroke: var(--accent-hover); }
        .empty h2 { font-size: 20px; font-weight: 600; margin-bottom: 8px; }
        .empty p { color: var(--text-muted); font-size: 15px; }

        @media (max-width: 640px) {
            .header { padding: 16px 20px; }
            .nav-link { padding: 8px 10px; font-size: 13px; }
            .main { padding: 32px 20px 60px; }
            .route-hero-path { font-size: 22px; }
            .route-hero-path .arrow svg { width: 22px; height: 22px; }
            .seats { grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); }
        }
    </style>
</head>
<body>

<header class="header">
    <a th:href="@{/}" class="brand">
        <div class="brand-logo">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M2 9a3 3 0 0 1 0 6v2a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-2a3 3 0 0 1 0-6V7a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2Z"/>
                <path d="M13 5v2"/><path d="M13 17v2"/><path d="M13 11v2"/>
            </svg>
        </div>
        <span>Система билетов</span>
    </a>
    <div class="header-actions">
        <a th:href="@{/}" class="nav-link">Главная</a>
        <a th:href="@{/routes}" class="nav-link active">Маршруты</a>
        <a th:href="@{/my-tickets}" class="nav-link">Мои билеты</a>
        <form th:action="@{/logout}" method="post">
            <button type="submit" class="logout-btn">
                <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                    <polyline points="16 17 21 12 16 7"/>
                    <line x1="21" y1="12" x2="9" y2="12"/>
                </svg>
                <span>Выйти</span>
            </button>
        </form>
    </div>
</header>

<main class="main">
    <a th:href="@{/routes}" class="back-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="19" y1="12" x2="5" y2="12"/>
            <polyline points="12 19 5 12 12 5"/>
        </svg>
        Назад к маршрутам
    </a>

    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

    <section class="route-hero">
        <div class="route-hero-path">
            <span th:text="${route.departurePoint}">Москва</span>
            <span class="arrow">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="5" y1="12" x2="19" y2="12"/>
                    <polyline points="12 5 19 12 12 19"/>
                </svg>
            </span>
            <span th:text="${route.destinationPoint}">СПб</span>
        </div>
        <div class="route-hero-meta">
            <div class="route-hero-meta-item">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
                    <line x1="16" y1="2" x2="16" y2="6"/>
                    <line x1="8" y1="2" x2="8" y2="6"/>
                    <line x1="3" y1="10" x2="21" y2="10"/>
                </svg>
                <span>Отправление:</span>
                <span class="value" th:text="${#temporals.format(route.departureAt, 'dd.MM.yyyy HH:mm')}">—</span>
            </div>
            <div class="route-hero-meta-item">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"/>
                    <polyline points="12 6 12 12 16 14"/>
                </svg>
                <span>Прибытие:</span>
                <span class="value" th:text="${#temporals.format(route.destinationAt, 'dd.MM.yyyy HH:mm')}">—</span>
            </div>
            <div class="route-hero-meta-item">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"/>
                    <polyline points="12 6 12 12 16 14"/>
                </svg>
                <span>В пути:</span>
                <span class="value" th:text="${T(com.example.ticketsmodule.web.util.DurationFormat).humanize(route.durationMinutes)}">8 ч</span>
            </div>
        </div>
    </section>

    <p class="section-title">Свободные места</p>

    <div th:if="${#lists.isEmpty(seats)}" class="empty">
        <div class="empty-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"/>
                <line x1="12" y1="8" x2="12" y2="12"/>
                <line x1="12" y1="16" x2="12.01" y2="16"/>
            </svg>
        </div>
        <h2>Свободных мест нет</h2>
        <p>Билеты на этот маршрут пока не выпущены или уже раскуплены.</p>
    </div>

    <div th:unless="${#lists.isEmpty(seats)}" class="seats">
        <form th:each="s : ${seats}"
              th:action="@{'/routes/' + ${route.id} + '/tickets/' + ${s.id} + '/buy'}"
              method="post">
            <button type="submit" class="seat">
                <span class="seat-num" th:text="${s.seatNumber}">1</span>
                <span class="seat-label">место</span>
                <span class="seat-price" th:text="${s.price} + ' ₽'">150 ₽</span>
            </button>
        </form>
    </div>
</main>

</body>
</html>
