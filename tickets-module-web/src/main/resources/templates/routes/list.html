<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Маршруты — Система билетов</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            color-scheme: dark;
            --bg-start: #0f172a; --bg-end: #1e293b;
            --accent: #6366f1; --accent-hover: #818cf8;
            --danger: #ef4444; --success: #10b981;
            --text: #e2e8f0; --text-muted: #94a3b8;
            --card-bg: rgba(30, 41, 59, 0.7);
            --card-hover: rgba(51, 65, 85, 0.85);
            --border: rgba(148, 163, 184, 0.15);
        }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, var(--bg-start) 0%, var(--bg-end) 100%);
            color: var(--text); position: relative; overflow-x: hidden;
        }
        body::before, body::after {
            content: ''; position: fixed; border-radius: 50%;
            filter: blur(120px); opacity: 0.35;
            pointer-events: none; z-index: 0;
        }
        body::before { width: 500px; height: 500px; background: var(--accent); top: -200px; left: -200px; }
        body::after { width: 400px; height: 400px; background: #8b5cf6; bottom: -150px; right: -150px; }

        .header {
            position: relative; z-index: 2;
            display: flex; align-items: center; justify-content: space-between;
            padding: 20px 32px; border-bottom: 1px solid var(--border);
            background: rgba(15, 23, 42, 0.5);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
        }
        .brand { display: flex; align-items: center; gap: 12px; font-size: 18px; font-weight: 700; letter-spacing: -0.3px; text-decoration: none; color: inherit; }
        .brand-logo { display: flex; align-items: center; justify-content: center; width: 40px; height: 40px;
            background: linear-gradient(135deg, var(--accent), #8b5cf6); border-radius: 12px;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.4); }
        .brand-logo svg { width: 22px; height: 22px; stroke: #fff; }
        .header-actions { display: flex; align-items: center; gap: 8px; }
        .nav-link { padding: 8px 14px; border-radius: 10px; color: var(--text-muted); text-decoration: none;
            font-size: 14px; font-weight: 500; transition: all 0.2s; }
        .nav-link:hover { color: var(--text); background: rgba(99, 102, 241, 0.1); }
        .nav-link.active { color: var(--accent-hover); background: rgba(99, 102, 241, 0.15); }
        .logout-btn { display: inline-flex; align-items: center; gap: 8px; padding: 10px 16px;
            background: rgba(239, 68, 68, 0.1); color: #fca5a5;
            border: 1px solid rgba(239, 68, 68, 0.25); border-radius: 10px;
            font-size: 14px; font-weight: 500; font-family: inherit; cursor: pointer;
            transition: all 0.2s ease; }
        .logout-btn:hover { background: rgba(239, 68, 68, 0.2); border-color: rgba(239, 68, 68, 0.4); color: #fecaca; transform: translateY(-1px); }
        .logout-btn svg { width: 16px; height: 16px; stroke: currentColor; }

        .main { position: relative; z-index: 1; max-width: 1000px; margin: 0 auto; padding: 48px 32px 80px; }
        .page-head { margin-bottom: 32px; animation: fadeInUp 0.5s cubic-bezier(0.16, 1, 0.3, 1); }
        .page-head h1 { font-size: 32px; font-weight: 700; letter-spacing: -1px; margin-bottom: 8px; }
        .page-head p { color: var(--text-muted); font-size: 15px; }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        /* ============ Search form ============ */
        .search-form {
            margin-bottom: 28px;
            padding: 22px 24px;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 16px;
            animation: fadeInUp 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .search-grid {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr)) auto;
            gap: 14px;
            align-items: end;
        }

        .search-field {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .search-field label {
            font-size: 12px;
            font-weight: 500;
            color: var(--text-muted);
            letter-spacing: 0.2px;
        }

        .search-input-wrapper {
            position: relative;
        }

        .search-input-wrapper svg {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            width: 16px;
            height: 16px;
            stroke: var(--text-muted);
            pointer-events: none;
            transition: stroke 0.2s;
        }

        .search-input-wrapper input {
            width: 100%;
            padding: 11px 12px 11px 38px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text);
            font-size: 14px;
            font-family: inherit;
            outline: none;
            transition: all 0.2s ease;
        }

        .search-input-wrapper input::placeholder {
            color: #64748b;
        }

        .search-input-wrapper input:hover {
            border-color: rgba(148, 163, 184, 0.3);
        }

        .search-input-wrapper input:focus {
            border-color: var(--accent);
            background: rgba(15, 23, 42, 0.85);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
        }

        .search-input-wrapper:focus-within svg {
            stroke: var(--accent);
        }

        .search-actions {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .btn-search,
        .btn-clear {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 11px 18px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.2s ease;
            white-space: nowrap;
            text-decoration: none;
            height: 42px;
        }

        .btn-search {
            background: linear-gradient(135deg, var(--accent), #8b5cf6);
            color: #fff;
            border: none;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
        }

        .btn-search:hover {
            transform: translateY(-1px);
            box-shadow: 0 8px 20px rgba(99, 102, 241, 0.45);
            filter: brightness(1.05);
        }

        .btn-search svg,
        .btn-clear svg {
            width: 15px;
            height: 15px;
            stroke: currentColor;
        }

        .btn-clear {
            background: transparent;
            color: var(--text-muted);
            border: 1px solid var(--border);
        }

        .btn-clear:hover {
            color: var(--text);
            border-color: rgba(148, 163, 184, 0.35);
            background: rgba(148, 163, 184, 0.08);
        }
        .routes { display: grid; gap: 16px; }
        .route-card {
            display: block; padding: 24px 26px;
            background: var(--card-bg);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border); border-radius: 16px;
            text-decoration: none; color: inherit;
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            animation: fadeInUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) backwards;
        }
        .route-card:hover { transform: translateY(-3px); border-color: rgba(99, 102, 241, 0.4); box-shadow: 0 12px 32px rgba(0, 0, 0, 0.3); }
        .route-head { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
        .route-path { display: flex; align-items: center; gap: 12px; font-size: 20px; font-weight: 700; }
        .route-path .arrow { color: var(--accent-hover); display: flex; align-items: center; }
        .route-path .arrow svg { width: 20px; height: 20px; stroke: currentColor; }
        .route-price-tag { font-size: 13px; padding: 4px 10px; border-radius: 8px; background: rgba(99, 102, 241, 0.12);
            border: 1px solid rgba(99, 102, 241, 0.3); color: var(--accent-hover); font-weight: 500; }
        .route-meta { display: flex; flex-wrap: wrap; gap: 20px 32px; font-size: 14px; color: var(--text-muted); }
        .route-meta-item { display: flex; align-items: center; gap: 8px; }
        .route-meta-item svg { width: 16px; height: 16px; stroke: var(--text-muted); flex-shrink: 0; }
        .route-meta-item .value { color: var(--text); font-weight: 500; }

        .pagination { display: flex; justify-content: center; align-items: center; gap: 8px; margin-top: 40px; }
        .page-btn {
            display: inline-flex; align-items: center; gap: 6px;
            padding: 10px 16px; border-radius: 10px;
            background: var(--card-bg); border: 1px solid var(--border);
            color: var(--text); text-decoration: none; font-size: 14px; font-weight: 500;
            font-family: inherit; cursor: pointer; transition: all 0.2s;
        }
        .page-btn:hover:not(.disabled) { border-color: rgba(99, 102, 241, 0.4); background: var(--card-hover); }
        .page-btn.disabled { opacity: 0.35; cursor: not-allowed; pointer-events: none; }
        .page-btn svg { width: 16px; height: 16px; stroke: currentColor; }
        .page-info { padding: 0 8px; color: var(--text-muted); font-size: 14px; }

        .empty { text-align: center; padding: 80px 20px; animation: fadeInUp 0.5s cubic-bezier(0.16, 1, 0.3, 1); }
        .empty-icon { display: flex; align-items: center; justify-content: center;
            width: 72px; height: 72px; margin: 0 auto 20px;
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.15), rgba(139, 92, 246, 0.15));
            border: 1px solid rgba(99, 102, 241, 0.3); border-radius: 18px; }
        .empty-icon svg { width: 36px; height: 36px; stroke: var(--accent-hover); }
        .empty h2 { font-size: 20px; font-weight: 600; margin-bottom: 8px; }
        .empty p { color: var(--text-muted); font-size: 15px; }

        @media (max-width: 640px) {
            .header { padding: 16px 20px; }
            .nav-link { padding: 8px 10px; font-size: 13px; }
            .main { padding: 32px 20px 60px; }
            .page-head h1 { font-size: 26px; }
            .route-head { flex-direction: column; align-items: flex-start; }
            .route-path { font-size: 17px; }
            .search-grid {
                grid-template-columns: 1fr;
                gap: 12px;
            }
            .search-actions {
                width: 100%;
            }
            .btn-search,
            .btn-clear {
                flex: 1;
                justify-content: center;
            }
        }
    </style>
</head>
<body>

<header class="header">
    <a th:href="@{/}" class="brand">
        <div class="brand-logo">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M2 9a3 3 0 0 1 0 6v2a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-2a3 3 0 0 1 0-6V7a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2Z"/>
                <path d="M13 5v2"/><path d="M13 17v2"/><path d="M13 11v2"/>
            </svg>
        </div>
        <span>Система билетов</span>
    </a>
    <div class="header-actions">
        <a th:href="@{/}" class="nav-link">Главная</a>
        <a th:href="@{/routes}" class="nav-link active">Маршруты</a>
        <a th:href="@{/my-tickets}" class="nav-link">Мои билеты</a>
        <form th:action="@{/logout}" method="post">
            <button type="submit" class="logout-btn">
                <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                    <polyline points="16 17 21 12 16 7"/>
                    <line x1="21" y1="12" x2="9" y2="12"/>
                </svg>
                <span>Выйти</span>
            </button>
        </form>
    </div>
</header>

<main class="main">
    <div class="page-head">
        <h1>Маршруты</h1>
        <p>Выберите маршрут, чтобы увидеть свободные места и купить билет.</p>
    </div>

    <form method="get" th:action="@{/routes}" class="search-form">
        <div class="search-grid">
            <div class="search-field">
                <label for="departurePoint">Откуда</label>
                <div class="search-input-wrapper">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                         stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/>
                        <circle cx="12" cy="10" r="3"/>
                    </svg>
                    <input type="text" id="departurePoint" name="departurePoint"
                           th:value="${departurePoint}"
                           placeholder="Москва" autocomplete="off"/>
                </div>
            </div>

            <div class="search-field">
                <label for="destinationPoint">Куда</label>
                <div class="search-input-wrapper">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                         stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/>
                        <circle cx="12" cy="10" r="3"/>
                    </svg>
                    <input type="text" id="destinationPoint" name="destinationPoint"
                           th:value="${destinationPoint}"
                           placeholder="Санкт-Петербург" autocomplete="off"/>
                </div>
            </div>

            <div class="search-field">
                <label for="departureDate">Дата отправления</label>
                <div class="search-input-wrapper">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                         stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
                        <line x1="16" y1="2" x2="16" y2="6"/>
                        <line x1="8" y1="2" x2="8" y2="6"/>
                        <line x1="3" y1="10" x2="21" y2="10"/>
                    </svg>
                    <input type="date" id="departureDate" name="departureDate"
                           th:value="${departureDate != null ? #temporals.format(departureDate, 'yyyy-MM-dd') : ''}"/>
                </div>
            </div>

            <div class="search-field">
                <label for="destinationDate">Дата прибытия</label>
                <div class="search-input-wrapper">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                         stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
                        <line x1="16" y1="2" x2="16" y2="6"/>
                        <line x1="8" y1="2" x2="8" y2="6"/>
                        <line x1="3" y1="10" x2="21" y2="10"/>
                    </svg>
                    <input type="date" id="destinationDate" name="destinationDate"
                           th:value="${destinationDate != null ? #temporals.format(destinationDate, 'yyyy-MM-dd') : ''}"/>
                </div>
            </div>

            <div class="search-actions">
                <button type="submit" class="btn-search">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                         stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8"/>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"/>
                    </svg>
                    Найти
                </button>
                <a th:href="@{/routes}" class="btn-clear"
                   th:if="${departurePoint != null or destinationPoint != null or departureDate != null or destinationDate != null}">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                         stroke-linecap="round" stroke-linejoin="round">
                        <line x1="18" y1="6" x2="6" y2="18"/>
                        <line x1="6" y1="6" x2="18" y2="18"/>
                    </svg>
                    Сбросить
                </a>
            </div>
        </div>
    </form>

    <div th:if="${#lists.isEmpty(page.content)}" class="empty">
        <div class="empty-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M9 20l-5.447-2.724A1 1 0 0 1 3 16.382V5.618a1 1 0 0 1 1.447-.894L9 7"/>
                <path d="M9 7l6-3 5.553 2.776A1 1 0 0 1 21 7.618v10.764a1 1 0 0 1-1.447.894L15 17"/>
                <path d="M15 17l-6 3"/>
            </svg>
        </div>
        <h2 th:text="${departurePoint != null or destinationPoint != null
              or departureDate != null or destinationDate != null
              ? 'Ничего не найдено'
              : 'Маршрутов пока нет'}">Маршрутов пока нет</h2>
        <p th:text="${departurePoint != null or destinationPoint != null
              or departureDate != null or destinationDate != null
              ? 'Попробуйте изменить параметры поиска.'
              : 'Зайдите позже — как только появятся маршруты, они отобразятся здесь.'}">—</p>
    </div>

    <div th:unless="${#lists.isEmpty(page.content)}" class="routes">
        <a class="route-card" th:each="r : ${page.content}"
           th:href="@{'/routes/' + ${r.id}}">
            <div class="route-head">
                <div class="route-path">
                    <span th:text="${r.departurePoint}">Москва</span>
                    <span class="arrow">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="5" y1="12" x2="19" y2="12"/>
                            <polyline points="12 5 19 12 12 19"/>
                        </svg>
                    </span>
                    <span th:text="${r.destinationPoint}">СПб</span>
                </div>
                <span class="route-price-tag">
                    <span th:text="${T(com.example.ticketsmodule.web.util.DurationFormat).humanize(r.durationMinutes)}">12 ч</span>
                </span>
            </div>
            <div class="route-meta">
                <div class="route-meta-item">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
                        <line x1="16" y1="2" x2="16" y2="6"/>
                        <line x1="8" y1="2" x2="8" y2="6"/>
                        <line x1="3" y1="10" x2="21" y2="10"/>
                    </svg>
                    <span>Отправление:</span>
                    <span class="value" th:text="${#temporals.format(r.departureAt, 'dd.MM.yyyy HH:mm')}">—</span>
                </div>
                <div class="route-meta-item">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"/>
                        <polyline points="12 6 12 12 16 14"/>
                    </svg>
                    <span>Прибытие:</span>
                    <span class="value" th:text="${#temporals.format(r.destinationAt, 'dd.MM.yyyy HH:mm')}">—</span>
                </div>
            </div>
        </a>
    </div>

    <div class="pagination" th:if="${page.totalPages > 1}">
        <a class="page-btn" th:classappend="${!page.hasPrevious()} ? 'disabled'"
           th:href="@{/routes(
           page=${page.number - 1},
           departurePoint=${departurePoint},
           destinationPoint=${destinationPoint},
           departureDate=${departureDate != null ? #temporals.format(departureDate, 'yyyy-MM-dd') : null},
           destinationDate=${destinationDate != null ? #temporals.format(destinationDate, 'yyyy-MM-dd') : null}
       )}">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round">
                <polyline points="15 18 9 12 15 6"/>
            </svg>
            Назад
        </a>
        <span class="page-info">
        Страница <span th:text="${page.number + 1}">1</span>
        из <span th:text="${page.totalPages}">1</span>
    </span>
        <a class="page-btn" th:classappend="${!page.hasNext()} ? 'disabled'"
           th:href="@{/routes(
           page=${page.number + 1},
           departurePoint=${departurePoint},
           destinationPoint=${destinationPoint},
           departureDate=${departureDate != null ? #temporals.format(departureDate, 'yyyy-MM-dd') : null},
           destinationDate=${destinationDate != null ? #temporals.format(destinationDate, 'yyyy-MM-dd') : null}
       )}">
            Вперёд
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round">
                <polyline points="9 18 15 12 9 6"/>
            </svg>
        </a>
    </div>
</main>

</body>
</html>
