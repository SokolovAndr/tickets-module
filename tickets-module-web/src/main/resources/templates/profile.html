<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Профиль — Система билетов</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg-start:#0f172a; --bg-end:#1e293b;
            --accent:#6366f1; --accent-hover:#818cf8;
            --danger:#ef4444; --success:#10b981;
            --text:#e2e8f0; --text-muted:#94a3b8;
            --card-bg:rgba(30,41,59,0.7);
            --card-hover:rgba(51,65,85,0.85);
            --border:rgba(148,163,184,0.15);
        }
        body {
            font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
            min-height:100vh;
            background:linear-gradient(135deg,var(--bg-start) 0%,var(--bg-end) 100%);
            color:var(--text); position:relative; overflow-x:hidden;
        }
        body::before,body::after {
            content:''; position:fixed; border-radius:50%;
            filter:blur(120px); opacity:.35; pointer-events:none; z-index:0;
        }
        body::before { width:500px; height:500px; background:var(--accent); top:-200px; left:-200px; }
        body::after  { width:400px; height:400px; background:#8b5cf6; bottom:-150px; right:-150px; }

        .header {
            position:relative; z-index:2;
            display:flex; align-items:center; justify-content:space-between;
            padding:20px 32px; border-bottom:1px solid var(--border);
            background:rgba(15,23,42,0.5);
            backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
        }
        .brand { display:flex; align-items:center; gap:12px; font-size:18px; font-weight:700;
            letter-spacing:-.3px; text-decoration:none; color:inherit; }
        .brand-logo { display:flex; align-items:center; justify-content:center; width:40px; height:40px;
            background:linear-gradient(135deg,var(--accent),#8b5cf6); border-radius:12px;
            box-shadow:0 4px 12px rgba(99,102,241,.4); flex-shrink:0; }
        .brand-logo svg { width:22px; height:22px; stroke:#fff; }
        .header-actions { display:flex; align-items:center; gap:8px; }
        .nav-link { padding:8px 14px; border-radius:10px; color:var(--text-muted);
            text-decoration:none; font-size:14px; font-weight:500; transition:all .2s; white-space:nowrap; }
        .nav-link:hover { color:var(--text); background:rgba(99,102,241,.1); }
        .nav-link.active { color:var(--accent-hover); background:rgba(99,102,241,.15); }
        .logout-btn { display:inline-flex; align-items:center; gap:8px; padding:10px 16px;
            background:rgba(239,68,68,.1); color:#fca5a5;
            border:1px solid rgba(239,68,68,.25); border-radius:10px;
            font-size:14px; font-weight:500; font-family:inherit; cursor:pointer; transition:all .2s; }
        .logout-btn:hover { background:rgba(239,68,68,.2); border-color:rgba(239,68,68,.4);
            color:#fecaca; transform:translateY(-1px); }
        .logout-btn svg { width:16px; height:16px; stroke:currentColor; }

        .main { position:relative; z-index:1; max-width:820px; margin:0 auto; padding:48px 32px 80px; }
        .page-head { margin-bottom:28px; animation:fadeInUp .5s cubic-bezier(.16,1,.3,1); }
        .page-head h1 { font-size:32px; font-weight:700; letter-spacing:-1px; margin-bottom:8px; }
        .page-head p { color:var(--text-muted); font-size:15px; }
        @keyframes fadeInUp { from{opacity:0;transform:translateY(20px);} to{opacity:1;transform:translateY(0);} }

        .alert { padding:12px 16px; border-radius:10px; font-size:14px; margin-bottom:16px;
            animation:slideDown .3s ease-out; }
        @keyframes slideDown { from{opacity:0;transform:translateY(-8px);} to{opacity:1;transform:translateY(0);} }
        .alert-success { background:rgba(16,185,129,.12); color:#6ee7b7; border:1px solid rgba(16,185,129,.25); }
        .alert-danger  { background:rgba(239,68,68,.12);  color:#fca5a5; border:1px solid rgba(239,68,68,.25); }

        .card {
            padding:28px 28px 32px; margin-bottom:24px;
            background:var(--card-bg);
            backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
            border:1px solid var(--border); border-radius:18px;
            animation:fadeInUp .5s cubic-bezier(.16,1,.3,1) backwards;
        }
        .card:nth-child(1) { animation-delay:.05s; }
        .card:nth-child(2) { animation-delay:.15s; }

        .card h2 { font-size:18px; font-weight:600; margin-bottom:6px; letter-spacing:-.3px; }
        .card .card-sub { font-size:13px; color:var(--text-muted); margin-bottom:22px; }

        .info-grid {
            display:grid;
            grid-template-columns:repeat(2,minmax(0,1fr));
            gap:14px 24px;
            margin-bottom:6px;
        }
        .info-item { display:flex; flex-direction:column; gap:4px; }
        .info-item .label { font-size:12px; color:var(--text-muted);
            text-transform:uppercase; letter-spacing:1px; }
        .info-item .value { font-size:15px; font-weight:500; word-break:break-word; }
        .role-pill {
            display:inline-flex; align-items:center; gap:6px;
            padding:4px 10px; border-radius:8px;
            background:rgba(99,102,241,.12); border:1px solid rgba(99,102,241,.3);
            color:var(--accent-hover); font-size:13px; font-weight:600;
            width:fit-content;
        }

        .form-group { margin-bottom:16px; }
        label { display:block; font-size:13px; font-weight:500; color:var(--text-muted);
            margin-bottom:8px; letter-spacing:.2px; }
        .input-wrapper { position:relative; }
        .input-wrapper svg {
            position:absolute; left:14px; top:50%; transform:translateY(-50%);
            width:18px; height:18px; stroke:var(--text-muted);
            pointer-events:none; transition:stroke .2s;
        }
        input {
            width:100%; padding:13px 14px 13px 44px;
            background:rgba(15,23,42,.6); border:1px solid var(--border);
            border-radius:12px; color:var(--text); font-size:15px;
            font-family:inherit; outline:none; transition:all .2s ease;
        }
        input::placeholder { color:#64748b; }
        input:hover { border-color:rgba(148,163,184,.3); }
        input:focus { border-color:var(--accent); background:rgba(15,23,42,.85);
            box-shadow:0 0 0 4px rgba(99,102,241,.15); }
        .input-wrapper:focus-within svg { stroke:var(--accent); }
        .input-wrapper.has-error input { border-color:var(--danger); background:rgba(239,68,68,.05); }
        .input-wrapper.has-error svg { stroke:var(--danger); }
        .field-error { display:block; margin-top:6px; font-size:12.5px; color:#fca5a5;
            animation:slideDown .25s ease-out; }

        .btn {
            display:inline-flex; align-items:center; justify-content:center; gap:8px;
            padding:13px 22px; border-radius:12px;
            background:linear-gradient(135deg,var(--accent),#8b5cf6);
            color:#fff; border:none; font-size:15px; font-weight:600;
            font-family:inherit; cursor:pointer; transition:all .2s ease;
            box-shadow:0 4px 16px rgba(99,102,241,.35);
        }
        .btn:hover { transform:translateY(-1px); box-shadow:0 8px 24px rgba(99,102,241,.5);
            filter:brightness(1.05); }
        .btn:active { transform:translateY(0); }
        .btn svg { width:16px; height:16px; stroke:currentColor; }

        @media (max-width: 640px) {
            .header {
                padding: 16px 16px;
                gap: 8px;
            }

            .brand span {
                display: none;
            }

            .nav-link {
                padding: 8px 8px;
                font-size: 12.5px;
            }

            .logout-btn {
                padding: 8px;
            }

            .logout-btn span {
                display: none;
            }

            .main {
                padding: 32px 20px 60px;
            }

            .page-head h1 {
                font-size: 26px;
            }

            .card {
                padding: 22px 20px 26px;
                border-radius: 14px;
            }

            .info-grid {
                grid-template-columns: 1fr;
            }

            .btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>

<header class="header">
    <a th:href="@{/}" class="brand">
        <div class="brand-logo">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M2 9a3 3 0 0 1 0 6v2a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-2a3 3 0 0 1 0-6V7a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2Z"/>
                <path d="M13 5v2"/><path d="M13 17v2"/><path d="M13 11v2"/>
            </svg>
        </div>
        <span>Система билетов</span>
    </a>
    <div class="header-actions">
        <a th:href="@{/routes}" class="nav-link">Маршруты</a>
        <a th:href="@{/my-tickets}" class="nav-link">Мои билеты</a>
        <a th:href="@{/profile}" class="nav-link active">Профиль</a>
        <form th:action="@{/logout}" method="post">
            <button type="submit" class="logout-btn">
                <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                    <polyline points="16 17 21 12 16 7"/>
                    <line x1="21" y1="12" x2="9" y2="12"/>
                </svg>
                <span>Выйти</span>
            </button>
        </form>
    </div>
</header>

<main class="main">
    <div class="page-head">
        <h1>Профиль</h1>
        <p>Управляйте своими данными и паролем.</p>
    </div>

    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

    <!-- ===== Информация о пользователе ===== -->
    <section class="card">
        <h2>Основная информация</h2>
        <p class="card-sub">Логин и роль изменению не подлежат.</p>

        <div class="info-grid">
            <div class="info-item">
                <span class="label">Логин</span>
                <span class="value" th:text="${user.login}">—</span>
            </div>
            <div class="info-item">
                <span class="label">Роль</span>
                <span class="role-pill" th:text="${user.role}">USER</span>
            </div>
            <div class="info-item">
                <span class="label">Создан</span>
                <span class="value"
                      th:text="${user.createdAt != null ? #temporals.format(user.createdAt, 'dd.MM.yyyy HH:mm') : '—'}">—</span>
            </div>
            <div class="info-item">
                <span class="label">Обновлён</span>
                <span class="value"
                      th:text="${user.updatedAt != null ? #temporals.format(user.updatedAt, 'dd.MM.yyyy HH:mm') : '—'}">—</span>
            </div>
        </div>
    </section>

    <!-- ===== Редактирование ФИО ===== -->
    <section class="card">
        <h2>Личные данные</h2>
        <p class="card-sub">Обновите своё ФИО.</p>

        <form th:action="@{/profile/edit}" th:object="${profileForm}" method="post">
            <div class="form-group">
                <label for="fullName">ФИО</label>
                <div class="input-wrapper"
                     th:classappend="${#fields.hasErrors('fullName')} ? 'has-error'">
                    <input type="text" id="fullName" th:field="*{fullName}"
                           placeholder="Иванов Иван Иванович" autocomplete="name"/>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                         stroke-linecap="round" stroke-linejoin="round">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                        <circle cx="12" cy="7" r="4"/>
                    </svg>
                </div>
                <span class="field-error" th:if="${#fields.hasErrors('fullName')}"
                      th:errors="*{fullName}"></span>
            </div>

            <button type="submit" class="btn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round">
                    <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/>
                    <polyline points="17 21 17 13 7 13 7 21"/>
                    <polyline points="7 3 7 8 15 8"/>
                </svg>
                Сохранить
            </button>
        </form>
    </section>

    <!-- ===== Смена пароля ===== -->
    <section class="card">
        <h2>Смена пароля</h2>
        <p class="card-sub">Новый пароль должен отличаться от текущего.</p>

        <form th:action="@{/profile/password}" th:object="${passwordForm}" method="post">
            <div class="form-group">
                <label for="oldPassword">Текущий пароль</label>
                <div class="input-wrapper"
                     th:classappend="${#fields.hasErrors('oldPassword')} ? 'has-error'">
                    <input type="password" id="oldPassword" th:field="*{oldPassword}"
                           placeholder="Введите текущий пароль" autocomplete="current-password"/>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                         stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                    </svg>
                </div>
                <span class="field-error" th:if="${#fields.hasErrors('oldPassword')}"
                      th:errors="*{oldPassword}"></span>
            </div>

            <div class="form-group">
                <label for="newPassword">Новый пароль</label>
                <div class="input-wrapper"
                     th:classappend="${#fields.hasErrors('newPassword')} ? 'has-error'">
                    <input type="password" id="newPassword" th:field="*{newPassword}"
                           placeholder="Минимум 5 символов" autocomplete="new-password"/>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                         stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                    </svg>
                </div>
                <span class="field-error" th:if="${#fields.hasErrors('newPassword')}"
                      th:errors="*{newPassword}"></span>
            </div>

            <div class="form-group">
                <label for="confirmPassword">Подтвердите новый пароль</label>
                <div class="input-wrapper"
                     th:classappend="${#fields.hasErrors('confirmPassword')} ? 'has-error'">
                    <input type="password" id="confirmPassword" th:field="*{confirmPassword}"
                           placeholder="Повторите новый пароль" autocomplete="new-password"/>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                         stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                        <path d="M9 16l2 2 4-4" stroke-width="2.5"/>
                    </svg>
                </div>
                <span class="field-error" th:if="${#fields.hasErrors('confirmPassword')}"
                      th:errors="*{confirmPassword}"></span>
            </div>

            <button type="submit" class="btn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                </svg>
                Сменить пароль
            </button>
        </form>
    </section>
</main>

</body>
</html>
