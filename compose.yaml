name: tickets-module-project

services:
  postgres:
    container_name: tickets-module-postgres
    image: postgres:13
    ports:
      - "5454:5432"
    environment:
      TZ: Europe/Moscow
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: tickets_module_db
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d tickets_module_db" ]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    container_name: tickets-module-redis
    image: redis:7-alpine
    ports:
      - "6379:6379"
  app:
    container_name: tickets-module-app
    build: .
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=local
#     НИЖЕ НУЖНО ЗАДАТЬ JWT_SECRET
      - JWT_SECRET=JWT_SECRET
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/tickets_module_db
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started