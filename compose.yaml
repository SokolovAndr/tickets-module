version: '1'
services:
  postgres:
    container_name: tickets-module-container
    image: postgres:13
    ports:
      - "5454:5432"
    environment:
      TZ: Europe/Moscow
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: tickets-module_db

  redis:
    container_name: tickets-module-redis
    image: redis:7-alpine
    ports:
      - "6379:6379"